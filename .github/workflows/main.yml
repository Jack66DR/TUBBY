name: Build TUBBY

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DTBY_BUILD_TESTS=ON

      - name: Build AU, VST3 and the engine test
        run: cmake --build build --config Release --target TUBBY_AU TUBBY_VST3 TUBBY_Test -j 4

      - name: Run offline engine test
        run: ./build/TUBBY_Test_artefacts/Release/TUBBY_Test

      - name: Sign (ad hoc) and zip
        run: |
          ART=build/TUBBY_artefacts/Release
          codesign --force --deep --sign - "$ART/AU/TUBBY.component"
          codesign --force --deep --sign - "$ART/VST3/TUBBY.vst3"
          mkdir -p dist
          ditto -c -k --keepParent "$ART/AU/TUBBY.component" dist/TUBBY-AU.zip
          ditto -c -k --keepParent "$ART/VST3/TUBBY.vst3" dist/TUBBY-VST3.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: TUBBY-macOS
          path: dist/*.zip

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/TUBBY_artefacts/Release/AU/TUBBY.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Tuby Mnrs
